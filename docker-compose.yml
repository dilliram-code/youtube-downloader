version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=Vidora
      - APP_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - DATABASE_URL=sqlite+aiosqlite:///./vidora.db
      - FFMPEG_PATH=ffmpeg
      - FFPROBE_PATH=ffprobe
      - DOWNLOADS_DIR=/app/storage/downloads
      - TEMP_DIR=/app/storage/temp
      - MAX_DOWNLOAD_SIZE_MB=2048
      - MAX_CONCURRENT_JOBS=3
      - JOB_RETENTION_HOURS=6
    volumes:
      - vidora_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  vidora_storage:
